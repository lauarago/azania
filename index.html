<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Azania Producciones</title>
<meta name="description" content="Azania Producciones. Web en construcción. Contacto: azaniaproducciones@gmail.com">
<meta name="theme-color" content="#F4F3EF">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%231F3BB3'/%3E%3Ctext x='32' y='45' text-anchor='middle' font-family='Arial Black,Arial,sans-serif' font-weight='900' font-size='38' fill='%23F4F3EF'%3EA%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{--bg:#F4F3EF;--ink:#121212;--soft:#3A3935;--muted:#5C5A55;--line:#D4D2CB;--blue:#1F3BB3}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Archivo',sans-serif;overflow-x:hidden}
  main{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;justify-content:space-between;gap:48px;padding:clamp(24px,5vw,72px)}

  .label{font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

  /* Fondo: luz azul muy suave que sigue al cursor + grano */
  .glow{position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(560px circle at var(--x,30%) var(--y,50%),rgba(31,59,179,.07),transparent 60%)}
  .grain{position:fixed;inset:-50%;width:200%;height:200%;pointer-events:none;z-index:2;opacity:.05;animation:grain 1s steps(6) infinite}
  @keyframes grain{0%,100%{transform:translate(0,0)}20%{transform:translate(-3%,2%)}40%{transform:translate(2%,-3%)}60%{transform:translate(-2%,-1%)}80%{transform:translate(3%,3%)}}

  header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:16px;opacity:0;animation:fade .8s ease .1s forwards}
  .status{display:flex;align-items:center;gap:10px}
  .dot{position:relative;width:8px;height:8px;border-radius:50%;background:var(--blue)}
  .dot::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--blue);animation:pulse 1.8s ease-out infinite}
  @keyframes pulse{0%{transform:scale(1);opacity:.6}100%{transform:scale(3.2);opacity:0}}

  section{display:flex;flex-wrap:wrap;align-items:center;gap:clamp(40px,6vw,96px)}

  /* Sello */
  .seal{width:clamp(240px,32vw,440px);height:auto;flex:0 0 auto;opacity:0;transform:scale(.85) rotate(-25deg);animation:sealIn 1.4s cubic-bezier(.2,.8,.2,1) .2s forwards}
  @keyframes sealIn{to{opacity:1;transform:none}}
  .ring{transform-origin:200px 200px;animation:spin 30s linear infinite}
  .seal:hover .ring{animation-duration:8s}
  @keyframes spin{to{transform:rotate(360deg)}}
  .ring text{font-family:'IBM Plex Mono',monospace;font-size:17px;letter-spacing:6px;text-transform:uppercase;fill:var(--blue)}
  .core{transform-origin:200px 200px;transform:scale(0);animation:pop .9s cubic-bezier(.3,1.4,.5,1) .7s forwards}
  @keyframes pop{to{transform:scale(1)}}
  .core text{font-family:'Archivo',sans-serif;font-weight:800;font-size:170px;fill:var(--bg)}

  .copy{flex:1 1 420px;min-width:0;display:flex;flex-direction:column;gap:28px}
  h1{margin:0;font-weight:800;font-size:clamp(48px,7vw,112px);line-height:.94;letter-spacing:-.03em}
  .line{display:block;overflow:hidden;padding-bottom:.04em}
  .line.blue{color:var(--blue)}
  .ch{display:inline-block;transform:translateY(105%);animation:rise .9s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(.6s + var(--i) * .04s)}
  @keyframes rise{to{transform:none}}
  p{margin:0;font-size:clamp(19px,1.8vw,24px);line-height:1.4;max-width:520px;color:var(--soft);opacity:0;animation:fadeUp .9s ease 1.5s forwards}

  .mail{align-self:flex-start;position:relative;color:var(--ink);font-size:clamp(19px,2vw,26px);font-weight:500;text-decoration:none;padding-bottom:6px;word-break:break-all;opacity:0;animation:fadeUp .9s ease 1.7s forwards;transition:color .3s}
  .mail::before,.mail::after{content:"";position:absolute;left:0;bottom:0;width:100%;height:2px}
  .mail::before{background:var(--line)}
  .mail::after{background:var(--blue);transform:scaleX(1);transform-origin:right;transition:transform .45s cubic-bezier(.6,0,.2,1)}
  .mail:hover,.mail:focus-visible{color:var(--blue)}
  .mail:hover::after,.mail:focus-visible::after{transform:scaleX(0)}
  .mail:focus-visible{outline:2px solid var(--blue);outline-offset:6px}

  footer{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--muted);opacity:0;animation:fade 1s ease 2s forwards}

  @keyframes fade{to{opacity:1}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
    header,p,.mail,footer,.seal{opacity:1;transform:none}
    .ch,.core{transform:none}
    .grain{display:none}
  }
</style>
</head>
<body>
<svg class="grain" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
<div class="glow" aria-hidden="true"></div>

<main>
  <header class="label">
    <span>Azania Producciones</span>
    <span class="status"><span class="dot" aria-hidden="true"></span>Web en construcción</span>
  </header>

  <section>
    <svg class="seal" viewBox="0 0 400 400" role="img" aria-label="Sello de Azania Producciones">
      <defs><path id="ringPath" d="M200,200 m-172,0 a172,172 0 1,1 344,0 a172,172 0 1,1 -344,0"/></defs>
      <g class="ring"><text><textPath href="#ringPath">Azania Producciones · Web en construcción · Azania Producciones · Web en construcción ·</textPath></text></g>
      <g class="core">
        <circle cx="200" cy="200" r="138" fill="#1F3BB3"/>
        <text x="200" y="258" text-anchor="middle">A</text>
      </g>
    </svg>

    <div class="copy">
      <h1 aria-label="Azania Producciones">
        <span class="line" aria-hidden="true"><span class="ch" style="--i:0">A</span><span class="ch" style="--i:1">z</span><span class="ch" style="--i:2">a</span><span class="ch" style="--i:3">n</span><span class="ch" style="--i:4">i</span><span class="ch" style="--i:5">a</span></span>
        <span class="line blue" aria-hidden="true"><span class="ch" style="--i:6">P</span><span class="ch" style="--i:7">r</span><span class="ch" style="--i:8">o</span><span class="ch" style="--i:9">d</span><span class="ch" style="--i:10">u</span><span class="ch" style="--i:11">c</span><span class="ch" style="--i:12">c</span><span class="ch" style="--i:13">i</span><span class="ch" style="--i:14">o</span><span class="ch" style="--i:15">n</span><span class="ch" style="--i:16">e</span><span class="ch" style="--i:17">s</span></span>
      </h1>
      <p>Estamos construyendo nuestra web. Mientras tanto, puedes escribirnos.</p>
      <a class="mail" href="mailto:azaniaproducciones@gmail.com">azaniaproducciones@gmail.com</a>
    </div>
  </section>

  <footer>© 2026 Azania Producciones</footer>
</main>

<script>
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
    const g = document.querySelector('.glow');
    addEventListener('pointermove', e => {
      g.style.setProperty('--x', e.clientX + 'px');
      g.style.setProperty('--y', e.clientY + 'px');
    }, { passive: true });
  }
</script>
</body>
</html>
